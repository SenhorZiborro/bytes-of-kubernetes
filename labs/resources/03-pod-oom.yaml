apiVersion: v1
kind: Pod
metadata:
  name: pod-oom
  namespace: lab
spec:
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "100M", "--vm-hang", "1"]
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "50Mi"
        cpu: "100m"
