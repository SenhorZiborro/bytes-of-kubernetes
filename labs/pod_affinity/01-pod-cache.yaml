apiVersion: v1
kind: Pod
metadata:
  name: pod-cache
  namespace: lab
  labels:
    app: cache
    tipo: redis
spec:
  containers:
  - name: redis
    image: redis:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
